<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nginxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="mysqlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="450" rx="16" fill="url(#bg)"/>

  <!-- Kubernetes Cluster Outer Boundary -->
  <rect x="40" y="40" width="820" height="370" rx="12" fill="url(#k8sGrad)" opacity="0.4" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="65" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Kubernetes Cluster (Namespace: assignment3)</text>

  <!-- Client Node -->
  <rect x="70" y="200" width="130" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="135" y="225" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Client</text>
  <text x="135" y="245" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">HTTP :30080</text>

  <!-- Connection Line 1 -->
  <path d="M 200 230 L 260 230" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Nginx Pod -->
  <rect x="260" y="160" width="160" height="140" rx="10" fill="url(#nginxGrad)" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Nginx Proxy</text>
  <text x="340" y="220" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">NodePort Service</text>
  <rect x="280" y="240" width="120" height="40" rx="6" fill="#064e3b" opacity="0.6"/>
  <text x="340" y="265" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Port 80 → 30080</text>

  <!-- Connection Line 2 -->
  <path d="M 420 230 L 480 230" stroke="#34d399" stroke-width="3" fill="none"/>

  <!-- Flask Pod -->
  <rect x="480" y="160" width="160" height="140" rx="10" fill="url(#flaskGrad)" stroke="#60a5fa" stroke-width="2"/>
  <text x="560" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Flask REST API</text>
  <text x="560" y="220" fill="#eff6ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Gunicorn WSGI</text>
  <rect x="500" y="240" width="120" height="40" rx="6" fill="#1e3a8a" opacity="0.6"/>
  <text x="560" y="265" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ClusterIP :5000</text>

  <!-- Connection Line 3 -->
  <path d="M 640 230 L 700 230" stroke="#60a5fa" stroke-width="3" fill="none"/>

  <!-- MySQL Pod -->
  <rect x="700" y="160" width="140" height="140" rx="10" fill="url(#mysqlGrad)" stroke="#fbbf24" stroke-width="2"/>
  <text x="770" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">MySQL 8.0</text>
  <text x="770" y="220" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Relational DB</text>
  <rect x="715" y="240" width="110" height="40" rx="6" fill="#78350f" opacity="0.6"/>
  <text x="770" y="265" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ClusterIP :3306</text>

  <!-- PV / Storage Line -->
  <path d="M 770 300 L 770 340" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <rect x="700" y="340" width="140" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="770" y="365" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">PVC / PV (1Gi Storage)</text>
</svg>
